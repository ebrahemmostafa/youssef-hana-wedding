<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Youssef &amp; Hana — Wedding Invitation</title>
<meta name="description" content="You are invited to the wedding of Youssef &amp; Hana — Saturday 31 October 2026, 03:00 PM, Hilton King's Ranch, Alexandria.">
<meta property="og:title" content="Youssef &amp; Hana — Wedding Invitation">
<meta property="og:description" content="Saturday 31 October 2026 · 03:00 PM · Hilton King's Ranch, Alexandria">
<meta property="og:image" content="assets/0.webp">
<meta name="theme-color" content="#efe3cf">
<link rel="preload" as="image" href="assets/intro-poster.jpg">
<link rel="preload" as="image" href="assets/0.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root {
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --script: "Great Vibes", "Segoe Script", cursive;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #e9dcc6; font-family: var(--serif); -webkit-font-smoothing: antialiased; }
  body.locked { overflow: hidden; height: 100%; }
  img, canvas { display: block; width: 100%; height: auto; }

  /* ---------- Intro video ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 50; background: #000 url(assets/intro-poster.jpg) center / cover no-repeat;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.2s ease;
  }
  #intro.hide { opacity: 0; pointer-events: none; }
  #intro video { width: 100%; height: 100%; object-fit: cover; }
  #tap {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end; padding-bottom: calc(9vh + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0) 45%);
    border: 0; cursor: pointer; color: #fff8ec; font-family: var(--serif); width: 100%;
  }
  #tap .names { font-family: var(--script); font-size: clamp(2.6rem, 10vw, 4rem); text-shadow: 0 2px 14px rgba(0,0,0,.5); margin-bottom: 1.4rem; }
  #tap .btn {
    letter-spacing: .3em; text-transform: uppercase; font-size: 1rem; font-weight: 600;
    padding: .9em 2em; border: 1px solid rgba(255,248,236,.85); border-radius: 999px;
    background: rgba(255,248,236,.12); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    animation: pulse 2.2s ease-in-out infinite;
  }
  #tap .hand { font-size: 1.6rem; margin-top: .8rem; animation: bob 1.6s ease-in-out infinite; }
  #tap.gone { display: none; }
  #skip {
    position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 2;
    background: rgba(0,0,0,.35); color: #fff8ec; border: 1px solid rgba(255,248,236,.5);
    border-radius: 999px; padding: .45em 1.1em; font-family: var(--serif); font-size: .95rem;
    letter-spacing: .12em; cursor: pointer; display: none;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,248,236,.45); } 50% { transform: scale(1.04); box-shadow: 0 0 0 12px rgba(255,248,236,0); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  /* ---------- Invitation (the designed cards) ---------- */
  .backdrop {
    position: fixed; inset: -40px; z-index: -1;
    background: url(assets/0.webp) center / cover no-repeat;
    filter: blur(28px) brightness(.9); transform: scale(1.1);
  }
  #site { opacity: 0; transition: opacity 1.4s ease .2s; }
  #site.show { opacity: 1; }
  .wrap {
    max-width: 480px; margin: 0 auto; box-shadow: 0 0 60px rgba(0,0,0,.3);
    background: #f4ead9 radial-gradient(ellipse at 50% 0%, #fbf5ea, #f1e4cd 70%);
  }
  .card { position: relative; display: block; container-type: inline-size; overflow: hidden; }
  /* one shared warm grade + soft edges so every design melts into the same cream paper */
  .card > img, .card > canvas {
    filter: sepia(.1) saturate(.96);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 4.5%, #000 95.5%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 4.5%, #000 95.5%, transparent 100%);
  }
  .card:first-child > img {
    -webkit-mask-image: linear-gradient(to bottom, #000 95.5%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 95.5%, transparent 100%);
  }
  .card:last-child > img, .card:last-child > canvas {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 4.5%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 4.5%);
  }
  /* the same gold ornament the designs use, between pages */
  .sep { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 6px 0; color: #a8864f; }
  .sep::before, .sep::after { content: ""; height: 1px; width: 84px; background: linear-gradient(to var(--dir, right), transparent, #b8975f); }
  .sep::after { --dir: left; }
  .sep svg { width: 34px; height: 18px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .reveal { opacity: 0; transform: translateY(18px); transition: opacity 1.1s ease, transform 1.1s ease; }
  .reveal.in { opacity: 1; transform: none; }

  /* card 1: venue — tap anywhere on the venue to open the map */
  .map-hit { position: absolute; left: 12%; right: 12%; top: 43%; height: 17%; border-radius: 20px; }
  .map-btn {
    position: absolute; left: 50%; top: 63%; transform: translateX(-50%);
    display: inline-flex; align-items: center; gap: .45em; white-space: nowrap;
    padding: .7em 1.5em; border-radius: 999px;
    background: rgba(74, 70, 40, .82); color: #fbf4e6; border: 1px solid rgba(251,244,230,.6);
    font-family: var(--serif); font-weight: 600; font-size: max(13px, 3.6cqw); letter-spacing: .16em; text-transform: uppercase;
    text-decoration: none; box-shadow: 0 6px 18px rgba(60,40,20,.3);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    animation: glow 2.6s ease-in-out infinite;
  }
  .map-btn svg { width: 1.1em; height: 1.1em; }
  @keyframes glow { 0%,100% { box-shadow: 0 6px 18px rgba(60,40,20,.3), 0 0 0 0 rgba(251,244,230,.5); } 50% { box-shadow: 0 6px 18px rgba(60,40,20,.3), 0 0 0 10px rgba(251,244,230,0); } }

  /* card 4: live countdown drawn over the image's own boxes */
  .digit {
    position: absolute; top: 55.2%; transform: translate(-50%, -50%);
    font-family: var(--serif); font-weight: 500; font-variant-numeric: lining-nums tabular-nums;
    font-size: 7.6cqw; line-height: 1; color: #5e3d1a; letter-spacing: .01em;
    visibility: hidden;
  }
  .ready .digit { visibility: visible; }

  /* music toggle */
  #music {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 40;
    width: 50px; height: 50px; border-radius: 50%; border: 1px solid rgba(255,248,236,.7);
    background: rgba(74,70,40,.85); color: #fbf4e6; cursor: pointer; display: none;
    align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(0,0,0,.3);
  }
  #music.on svg { animation: spin 4s linear infinite; }
  #music svg { width: 22px; height: 22px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #yt { position: fixed; left: -9999px; top: 0; width: 200px; height: 200px; pointer-events: none; opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    .reveal { transition: none; opacity: 1; transform: none; }
    #tap .btn, #tap .hand, #music.on svg, .map-btn { animation: none; }
  }
</style>
</head>
<body class="locked">

<!-- Intro video: waits for a tap -->
<div id="intro">
  <video id="introVideo" src="assets/intro.mp4" poster="assets/intro-poster.jpg" playsinline webkit-playsinline preload="auto" muted></video>
  <button id="tap" type="button" aria-label="Click to open the invitation">
    <span class="names">Youssef &amp; Hana</span>
    <span class="btn">Click to open</span>
    <span class="hand" aria-hidden="true">&#9758;</span>
  </button>
  <button id="skip" type="button">Skip &rsaquo;</button>
</div>

<div class="backdrop" aria-hidden="true"></div>

<main id="site" aria-hidden="true">
  <div class="wrap">

    <div class="card">
      <img src="assets/0.webp" width="1024" height="1536"
           alt="We invite you to celebrate our wedding — Saturday 31 October 2026, 03:00 PM — Youssef &amp; Hana">
    </div>

    <div class="sep" aria-hidden="true"><svg viewBox="0 0 34 18" fill="currentColor"><path d="M17 1c1.6 3 3.6 5 7 6-3.4 1-5.4 3-7 6-1.6-3-3.6-5-7-6 3.4-1 5.4-3 7-6z"/><path d="M2 9c3-1.6 5.4-1.6 7 0-1.6 1.6-4 1.6-7 0zm30 0c-3-1.6-5.4-1.6-7 0 1.6 1.6 4 1.6 7 0z" opacity=".75"/><circle cx="17" cy="16.3" r="1.1"/></svg></div>

    <div class="card reveal">
      <img src="assets/1.webp" width="857" height="1600"
           alt="Saturday 31 October 2026, 03:00 PM — Hilton King's Ranch, Alexandria, Cascadia">
      <a class="map-hit" href="https://maps.app.goo.gl/mrijqHygwuovBXgq9?g_st=ic" target="_blank" rel="noopener" aria-hidden="true" tabindex="-1"></a>
      <a class="map-btn" href="https://maps.app.goo.gl/mrijqHygwuovBXgq9?g_st=ic" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        View location
      </a>
    </div>

    <div class="sep" aria-hidden="true"><svg viewBox="0 0 34 18" fill="currentColor"><path d="M17 1c1.6 3 3.6 5 7 6-3.4 1-5.4 3-7 6-1.6-3-3.6-5-7-6 3.4-1 5.4-3 7-6z"/><path d="M2 9c3-1.6 5.4-1.6 7 0-1.6 1.6-4 1.6-7 0zm30 0c-3-1.6-5.4-1.6-7 0 1.6 1.6 4 1.6 7 0z" opacity=".75"/><circle cx="17" cy="16.3" r="1.1"/></svg></div>

    <div class="card reveal">
      <img src="assets/2.webp" width="807" height="1466" loading="lazy"
           alt="Please be on time at 03:00 PM, as the Katb El-Kitab will be the first part of our wedding day, and it is the most important moment for us. We don't want you to miss it.">
    </div>

    <div class="sep" aria-hidden="true"><svg viewBox="0 0 34 18" fill="currentColor"><path d="M17 1c1.6 3 3.6 5 7 6-3.4 1-5.4 3-7 6-1.6-3-3.6-5-7-6 3.4-1 5.4-3 7-6z"/><path d="M2 9c3-1.6 5.4-1.6 7 0-1.6 1.6-4 1.6-7 0zm30 0c-3-1.6-5.4-1.6-7 0 1.6 1.6 4 1.6 7 0z" opacity=".75"/><circle cx="17" cy="16.3" r="1.1"/></svg></div>

    <div class="card reveal">
      <img src="assets/3.webp" width="798" height="1449" loading="lazy"
           alt="A note from the bride: Our little guests (our precious kids) are a very special part of our celebration. We want them to feel the joy and magic of this day too. Girls: white wedding dresses. Boys: suits or at least classic attire.">
    </div>

    <div class="sep" aria-hidden="true"><svg viewBox="0 0 34 18" fill="currentColor"><path d="M17 1c1.6 3 3.6 5 7 6-3.4 1-5.4 3-7 6-1.6-3-3.6-5-7-6 3.4-1 5.4-3 7-6z"/><path d="M2 9c3-1.6 5.4-1.6 7 0-1.6 1.6-4 1.6-7 0zm30 0c-3-1.6-5.4-1.6-7 0 1.6 1.6 4 1.6 7 0z" opacity=".75"/><circle cx="17" cy="16.3" r="1.1"/></svg></div>

    <div class="card reveal" id="countCard">
      <img id="countImg" src="assets/4.webp" width="900" height="1600" loading="lazy"
           alt="We can't wait to celebrate this special day with you — The Big Day countdown">
      <span class="digit" id="cd-d" style="left:32.0%"></span>
      <span class="digit" id="cd-h" style="left:44.0%"></span>
      <span class="digit" id="cd-m" style="left:55.9%"></span>
      <span class="digit" id="cd-s" style="left:68.2%"></span>
      <span class="sr" id="cd-text" aria-live="off"></span>
    </div>

  </div>
</main>

<button id="music" type="button" aria-label="Pause music">
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
</button>
<div id="yt"><div id="ytPlayer"></div></div>

<script>
(function () {
  var YT_ID = 'dKhq77ykcro';
  var WEDDING = new Date('2026-10-31T15:00:00+02:00'); // Alexandria (EET)

  var intro = document.getElementById('intro');
  var video = document.getElementById('introVideo');
  var tap = document.getElementById('tap');
  var skip = document.getElementById('skip');
  var site = document.getElementById('site');
  var musicBtn = document.getElementById('music');
  var opened = false, revealed = false;

  /* ---------- Background music (YouTube) ---------- */
  var player = null, playerReady = false, wantMusic = false;
  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('ytPlayer', {
      width: 200, height: 200, videoId: YT_ID,
      playerVars: { autoplay: 0, controls: 0, loop: 1, playlist: YT_ID, playsinline: 1, rel: 0 },
      events: {
        onReady: function () { playerReady = true; player.setVolume(70); if (wantMusic) startMusic(); },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.ENDED) { player.seekTo(0); player.playVideo(); }
          musicBtn.classList.toggle('on', e.data === YT.PlayerState.PLAYING);
        }
      }
    });
  };
  function startMusic() {
    wantMusic = true;
    if (playerReady) { player.unMute(); player.playVideo(); }
  }
  musicBtn.addEventListener('click', function () {
    if (!playerReady) return;
    if (player.getPlayerState() === YT.PlayerState.PLAYING) {
      player.pauseVideo(); musicBtn.setAttribute('aria-label', 'Play music');
    } else {
      player.playVideo(); musicBtn.setAttribute('aria-label', 'Pause music');
    }
  });

  /* ---------- Intro ---------- */
  function open() {
    if (opened) return;
    opened = true;
    tap.classList.add('gone');
    startMusic();                       // must run inside the tap gesture
    var p = video.play();
    if (p && p.catch) p.catch(revealSite);
    setTimeout(function () { skip.style.display = 'block'; }, 1500);
  }
  function revealSite() {
    if (revealed) return;
    revealed = true;
    site.setAttribute('aria-hidden', 'false');
    site.classList.add('show');
    intro.classList.add('hide');
    document.body.classList.remove('locked');
    musicBtn.style.display = 'flex';
    window.scrollTo(0, 0);
    setTimeout(function () { intro.style.display = 'none'; video.pause(); }, 1300);
  }
  tap.addEventListener('click', open);
  video.addEventListener('ended', revealSite);
  video.addEventListener('error', function () { if (opened) revealSite(); });
  skip.addEventListener('click', revealSite);

  /* ---------- Reveal on scroll ---------- */
  var items = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
    }, { threshold: 0.12 });
    items.forEach(function (el) { io.observe(el); });
  } else {
    items.forEach(function (el) { el.classList.add('in'); });
  }

  /* ---------- Countdown: erase the printed digits, draw live ones ---------- */
  // Centres of the four boxes in the 900x1600 artwork; digits span y≈863–904.
  var BOX_X = [288, 396, 503, 613], Y0 = 856, Y1 = 912, HALF = 40;
  var countCard = document.getElementById('countCard');
  var countImg = document.getElementById('countImg');
  countImg.loading = 'eager';
  function cleanCountImage() {
    try {
      var c = document.createElement('canvas');
      c.width = countImg.naturalWidth; c.height = countImg.naturalHeight;
      var ctx = c.getContext('2d');
      ctx.drawImage(countImg, 0, 0);
      var sx = c.width / 900, sy = c.height / 1600;
      BOX_X.forEach(function (cx) {
        var x0 = Math.round((cx - HALF) * sx), x1 = Math.round((cx + HALF) * sx);
        var y0 = Math.round(Y0 * sy), y1 = Math.round(Y1 * sy), w = x1 - x0 + 1, h = y1 - y0 + 1;
        var img = ctx.getImageData(x0, y0, w, h), d = img.data;
        // Fill each pixel by blending the clean edges of the patch (bilinear from all four sides).
        for (var y = 0; y < h; y++) {
          for (var x = 0; x < w; x++) {
            var fx = x / (w - 1), fy = y / (h - 1), o = (y * w + x) * 4;
            var l = (y * w) * 4, r = (y * w + w - 1) * 4, t = x * 4, b = ((h - 1) * w + x) * 4;
            var wl = 1 - fx, wr = fx, wt = 1 - fy, wb = fy, sum = wl + wr + wt + wb;
            for (var k = 0; k < 3; k++) {
              d[o + k] = (d[l + k] * wl + d[r + k] * wr + d[t + k] * wt + d[b + k] * wb) / sum;
            }
          }
        }
        ctx.putImageData(img, x0, y0);
      });
      c.setAttribute('role', 'img');
      c.setAttribute('aria-label', countImg.alt);
      countImg.replaceWith(c);
      countCard.classList.add('ready');
    } catch (e) { /* keep the original artwork if canvas is unavailable */ }
  }
  if (countImg.complete && countImg.naturalWidth) cleanCountImage();
  else countImg.addEventListener('load', cleanCountImage);

  var els = { d: 'cd-d', h: 'cd-h', m: 'cd-m', s: 'cd-s' };
  for (var k in els) els[k] = document.getElementById(els[k]);
  var cdText = document.getElementById('cd-text');
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function tick() {
    var s = Math.max(0, Math.floor((WEDDING - new Date()) / 1000));
    var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    els.d.textContent = pad(d);
    els.h.textContent = pad(h);
    els.m.textContent = pad(m);
    els.s.textContent = pad(sec);
    cdText.textContent = d + ' days, ' + h + ' hours, ' + m + ' minutes to go';
    if (s > 0) setTimeout(tick, 1000);
  }
  tick();
})();
</script>
</body>
</html>
